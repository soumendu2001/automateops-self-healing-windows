---
- name: Get CPU Utilization After Remediation
  ansible.windows.win_shell: |
    $cpu = (Get-Counter '\Processor(_Total)\% Processor Time').CounterSamples.CookedValue
    [math\]::Round($cpu,2)
  register: cpu_after

- name: Display CPU After Remediation
  debug:
    msg: "CPU Usage After Remediation: {{ cpu_after.stdout }} %"

- name: Verify Connectivity
  ansible.windows.win_ping:

- name: CPU Threshold Validation
  debug:
    msg: >
      CPU remains above threshold ({{ cpu_threshold }}%).
      Additional remediation may be required.
  when: cpu_after.stdout | float > cpu_threshold

- name: System Healthy
  debug:
    msg: >
      CPU is below threshold ({{ cpu_threshold }}%).
      Remediation successful.
  when: cpu_after.stdout | float <= cpu_threshold

- name: Display Summary
  debug:
    msg:
      - "Host: {{ inventory_hostname }}"
      - "CPU Before: {{ cpu_before.stdout }} %"
      - "CPU After: {{ cpu_after.stdout }} %"
      - "Threshold: {{ cpu_threshold }} %"
