---
- name: Get CPU Utilization After Remediation
  ansible.windows.win_shell: |
    [math]::Round(
      (Get-Counter '\Processor(_Total)\% Processor Time').CounterSamples.CookedValue,
      2
    )
  register: cpu_after

- name: Display CPU After Remediation
  debug:
    msg: "CPU Usage After Remediation: {{ cpu_after.stdout | trim }} %"

- name: Verify Connectivity
  ansible.windows.win_ping:

- name: CPU Threshold Validation
  debug:
    msg: >
      CPU remains above threshold ({{ cpu_threshold | trim}}%).
      Manual investigation may be required.
  when:
    - cpu_after.stdout | float > cpu_threshold

- name: System Healthy
  debug:
    msg: >
      CPU is below threshold ({{ cpu_threshold | trim }}%).
      System is healthy.
  when:
    - cpu_after.stdout | float <= cpu_threshold

- name: Display Final Summary
  debug:
    msg:
      - "Host: {{ inventory_hostname }}"
      - "CPU Before: {{ cpu_before.stdout | trim}} %"
      - "CPU After: {{ cpu_after.stdout | trim }} %"
      - "Threshold: {{ cpu_threshold | trim }} %"
      - "Status: {{ 'AUTO_REMEDIATED' if (cpu_after.stdout | float <= cpu_threshold) else 'INVESTIGATION_REQUIRED' }}"
